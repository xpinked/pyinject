[tool.poetry]
name = "pyinject"
version = "0.0.5"
description = "Python Dependency Injection made easy, Inspired by FastAPI."
authors = ["Udi Shalev"]
license = "MIT license"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
pytest-html = "^4.1.1"
ipython = "^8.37.0"
mypy = "^1.18.1"
pytest-xdist = "^3.8.0"
ruff = "^0.5.1"
poetry = "^2.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
